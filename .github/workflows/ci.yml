name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra examples
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    name: Tests (Python ${{ matrix.python }}, livekit-agents ${{ matrix.livekit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # The oldest supported release and the newest 1.x one.
        livekit: ["1.8.7", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        env:
          LIVEKIT: ${{ matrix.livekit == 'latest' && 'livekit-agents>=1.8.7,<2' || format('livekit-agents=={0}', matrix.livekit) }}
        run: |
          uv venv
          uv pip install -e . "$LIVEKIT" pytest pytest-asyncio
      - run: uv run --no-sync python -c "import livekit.agents as a; print('livekit-agents', a.__version__)"
      - run: uv run --no-sync pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The wheel is a namespace package
        run: |
          python3 - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "livekit/__init__.py" not in names, names
          assert "livekit/plugins/__init__.py" not in names, names
          assert "livekit/plugins/bakbak/py.typed" in names, names
          PY

  conformance:
    name: Conformance manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every file matches the manifest
        working-directory: conformance
        run: sha256sum -c --strict MANIFEST.sha256
      - name: Every file is in the manifest
        working-directory: conformance
        run: |
          diff <(find . -type f ! -name MANIFEST.sha256 | sort) \
               <(awk '{print $2}' MANIFEST.sha256 | sort)

  live:
    name: Live (staging)
    # Runs against a real deployment, so only on main or by hand, one run at a time,
    # and only when the secrets are configured.
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    concurrency:
      group: live
      cancel-in-progress: false
    env:
      BAKBAK_API_KEY: ${{ secrets.BAKBAK_API_KEY }}
      BAKBAK_BASE_URL: ${{ secrets.BAKBAK_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.BAKBAK_API_KEY != '' && env.BAKBAK_BASE_URL != ''
      - uses: astral-sh/setup-uv@v6
        if: env.BAKBAK_API_KEY != '' && env.BAKBAK_BASE_URL != ''
        with:
          python-version: "3.12"
      - if: env.BAKBAK_API_KEY != '' && env.BAKBAK_BASE_URL != ''
        run: uv sync --locked
      - if: env.BAKBAK_API_KEY != '' && env.BAKBAK_BASE_URL != ''
        run: uv run pytest -m live -s
