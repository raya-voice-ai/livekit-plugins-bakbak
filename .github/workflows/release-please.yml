name: Release Please

# Keeps a release pull request up to date from the conventional commits on main;
# merging it tags the commit and creates the GitHub release, which publish.yml ships.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write  # to dispatch publish.yml for a new release

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A release created with GITHUB_TOKEN does not trigger publish.yml by itself.
      - name: Publish the new release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
