name: Publish to PyPI

# release-please creates releases with GITHUB_TOKEN, and events made with that token start no
# workflows, except workflow_dispatch. So release-please.yml dispatches this workflow on the new
# release's tag; publishing a release by hand also triggers it. PyPI's trusted publisher names
# this file, so publishing must stay here.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Releases come only from main: refuse a v* tag on a commit main does not contain.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: The built version is the release's
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project --with packaging python -c "from packaging.version import Version; print(Version('$tag'))")"
          compgen -G "dist/*-${version}[-.]*" > /dev/null || { echo "dist/ does not hold ${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # The pypi environment waits for the maintainer's approval and only accepts v* tags.
    environment:
      name: pypi
      url: https://pypi.org/p/livekit-plugins-bakbak
    permissions:
      id-token: write  # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
